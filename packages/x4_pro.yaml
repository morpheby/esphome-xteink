# Xteink X4 Pro: ESP32-S3, 16 MB flash, 8 MB PSRAM, USB Serial/JTAG console.
#   packages:
#     board: github://morpheby/esphome-xteink/packages/x4_pro.yaml
esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  flash_mode: dio
  framework:
    type: arduino

logger:
  hardware_uart: USB_SERIAL_JTAG

# The ESP32-S3R8 module uses octal PSRAM with DIO flash. Explicitly enabling
# ESPHome's PSRAM component supplies BOARD_HAS_PSRAM and initializes the RAM;
# ignore_not_found: false prevents a low-memory boot that looks superficially
# healthy but makes LVGL/grayscale allocations unreliable.
psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

xteink:
  model: x4_pro
